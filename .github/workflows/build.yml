# Validate every push and pull request. A tag vMAJOR.MINOR.PATCH also packs the release with Velopack
# and publishes it on GitHub, which is where installed launchers look for updates. A push to development
# publishes a development build, a pre-release that only those who ticked the loader's box take
# (docs/releasing.md). A push of documentation alone runs nothing; a tag always runs.
name: build

on:
  push:
    branches: [main, development]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    # A development push and a release's tag each build and test once, in the job that publishes them: package.ps1 validates
    # what it packs, before anything is uploaded.
    if: github.ref != 'refs/heads/development' && !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The API reference is built with the Doxygen tools/docs.ps1 pins, from Doxygen's own download, checked against
      # its hash before it runs.
      - name: Get Doxygen
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'doxygen.zip'
          Invoke-WebRequest -Uri 'https://www.doxygen.nl/files/doxygen-1.18.0.windows.x64.bin.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($hash -ne 'E84F54CFD49EF06B0B16536056DBEC0C496323DE28ABCCE53A4269463DE35EAF') {
            throw "The Doxygen download's hash is $hash, not the pinned one."
          }
          $dir = Join-Path $env:RUNNER_TEMP 'doxygen'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          "PM_DOXYGEN=$(Join-Path $dir 'doxygen.exe')" | Add-Content -LiteralPath $env:GITHUB_ENV
      # build.ps1 finds Visual Studio with vswhere and loads its developer environment, which supplies
      # CMake and Ninja.
      - name: Validate
        shell: pwsh
        run: .\validate.ps1

  publish-development:
    name: Publish the development build
    if: github.ref == 'refs/heads/development'
    runs-on: windows-latest
    # One publish at a time, never cancelled halfway.
    concurrency:
      group: publish-development
      cancel-in-progress: false
    permissions:
      contents: write # vpk creates the pre-release, and gh removes the old ones
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore vpk
        shell: pwsh
        run: dotnet tool restore
      # In this job's copy alone: only release versions are ever committed.
      - name: Number the build
        shell: pwsh
        env:
          BUILD: ${{ github.run_number }}
        run: |
          . tools/dev_releases.ps1
          $version = Get-DevVersion (Get-Content -LiteralPath VERSION -Raw) ([int]$env:BUILD)
          Set-Content -LiteralPath VERSION -Value $version
          "DEV_VERSION=$version" | Add-Content -LiteralPath $env:GITHUB_ENV
      # The API reference is built with the Doxygen tools/docs.ps1 pins, from Doxygen's own download, checked against
      # its hash before it runs.
      - name: Get Doxygen
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'doxygen.zip'
          Invoke-WebRequest -Uri 'https://www.doxygen.nl/files/doxygen-1.18.0.windows.x64.bin.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($hash -ne 'E84F54CFD49EF06B0B16536056DBEC0C496323DE28ABCCE53A4269463DE35EAF') {
            throw "The Doxygen download's hash is $hash, not the pinned one."
          }
          $dir = Join-Path $env:RUNNER_TEMP 'doxygen'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          "PM_DOXYGEN=$(Join-Path $dir 'doxygen.exe')" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Pack the build
        shell: pwsh
        run: .\package.ps1 -Channel dev
      - name: Publish the build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          dotnet tool run vpk upload github --repoUrl $env:REPO_URL --publish --pre --channel dev --tag "dev-$env:DEV_VERSION" `
              --targetCommitish $env:GITHUB_SHA --releaseName "PhasmoMods development $env:DEV_VERSION" --outputDir dist/releases --token $env:GH_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed with exit code $LASTEXITCODE." }
      - name: Remove old development builds
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          . tools/dev_releases.ps1
          Remove-OldDevReleases $env:REPOSITORY

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # One publish at a time, never cancelled halfway, so two tags cannot race to upload.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write # vpk creates the GitHub release and uploads its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, so the next step can see whether main contains the tag
      - name: Check the tag is on main
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -eq 1) {
              Write-Error "The tag $env:TAG is on a commit that is not on main. Releases are made from main only."
              exit 1
          }
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Could not check whether main contains the tag $env:TAG (git exit code $LASTEXITCODE)."
              exit 1
          }
      - name: Restore vpk
        shell: pwsh
        run: dotnet tool restore
      - name: Check the tag matches VERSION
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $expected = 'v' + (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:TAG -ne $expected) {
              Write-Error "The tag is $env:TAG but VERSION says $expected."
              exit 1
          }
      # The API reference is built with the Doxygen tools/docs.ps1 pins, from Doxygen's own download, checked against
      # its hash before it runs.
      - name: Get Doxygen
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'doxygen.zip'
          Invoke-WebRequest -Uri 'https://www.doxygen.nl/files/doxygen-1.18.0.windows.x64.bin.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($hash -ne 'E84F54CFD49EF06B0B16536056DBEC0C496323DE28ABCCE53A4269463DE35EAF') {
            throw "The Doxygen download's hash is $hash, not the pinned one."
          }
          $dir = Join-Path $env:RUNNER_TEMP 'doxygen'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          "PM_DOXYGEN=$(Join-Path $dir 'doxygen.exe')" | Add-Content -LiteralPath $env:GITHUB_ENV
      # package.ps1 validates again, then packs into dist/releases, which it replaces whole. Updates
      # are therefore full packages, not deltas: a delta needs the previous release beside the new
      # pack, and the script packs into an empty folder.
      - name: Pack the release
        shell: pwsh
        run: .\package.ps1
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          dotnet tool run vpk upload github --repoUrl $env:REPO_URL --publish --tag $env:TAG `
              --releaseName "PhasmoMods $env:TAG" --outputDir dist/releases --token $env:GH_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed with exit code $LASTEXITCODE." }
