# Validate every push and pull request. A tag vMAJOR.MINOR.PATCH also packs the release with Velopack
# and publishes it on GitHub, which is where installed launchers look for updates. A push to development
# publishes a development build, a pre-release that only those who ticked the loader's box take
# (docs/releasing.md). A push of documentation alone runs nothing; a tag always runs.
name: build

on:
  push:
    branches: [main, development]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    # A development push and a release's tag each build and test once, in the job that publishes them: package.ps1 validates
    # what it packs, before anything is uploaded.
    if: github.ref != 'refs/heads/development' && !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Squatter's AssetBundle holds Mixamo's clips, which may not be in this public repository: it comes from the
      # private assets repository (the ASSETS_REPOSITORY variable, owner/name) with a read-only deploy key of that
      # repository (the ASSETS_DEPLOY_KEY secret). Without them the build fails at its stage, as it must: Custom Ghosts
      # does not start without the bundle (tools/payload.psd1). The build placed is the one tools/payload.psd1 pins
      # (tools/place_assets.ps1): a pin whose build was never published fails here rather than shipping another.
      - name: Fetch the private assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # A fetch that hangs gives up here instead of holding the run for hours (2026-11-09 and 2026-11-10).
        timeout-minutes: 5
        with:
          repository: ${{ vars.ASSETS_REPOSITORY }}
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: private-assets
          persist-credentials: false
          # Named, so the checkout never looks the default branch up (a run hung there, 2026-11-09), and only the
          # pinned builds: the repository also keeps the working files and the bundle's Unity project, which no build
          # needs.
          ref: main
          sparse-checkout: /pinned/
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Place the Squatter's bundle
        shell: pwsh
        run: |
          ./tools/place_assets.ps1 -Assets private-assets
          Remove-Item -LiteralPath private-assets -Recurse -Force
      # The API reference is built with the Doxygen tools/docs.ps1 pins, from Doxygen's own download, checked against
      # its hash before it runs.
      - name: Get Doxygen
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'doxygen.zip'
          Invoke-WebRequest -Uri 'https://www.doxygen.nl/files/doxygen-1.18.0.windows.x64.bin.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($hash -ne 'E84F54CFD49EF06B0B16536056DBEC0C496323DE28ABCCE53A4269463DE35EAF') {
            throw "The Doxygen download's hash is $hash, not the pinned one."
          }
          $dir = Join-Path $env:RUNNER_TEMP 'doxygen'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          "PM_DOXYGEN=$(Join-Path $dir 'doxygen.exe')" | Add-Content -LiteralPath $env:GITHUB_ENV
      # Compiles go through ccache, its store kept between runs, so a file compiled before with the same inputs comes
      # from the store rather than the compiler: a build from nothing compiled 521 files for 15 minutes, most of them
      # unchanged since the last push. ccache is the pinned release, checked against its hash before it runs, and
      # build.ps1 hands it to CMake as the compiler launcher. The release job leaves it out.
      - name: Restore the compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Get ccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -Uri 'https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($hash -ne '6993CE645E53192CEC592EE23186200B574AC4C59097ECDE8D9CFD681B47AE84') {
            throw "The ccache download's hash is $hash, not the pinned one."
          }
          $dir = Join-Path $env:RUNNER_TEMP 'ccache-tool'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $exe = Join-Path $dir 'ccache-4.14.2-windows-x86_64\ccache.exe'
          $env:CCACHE_DIR = Join-Path $env:RUNNER_TEMP 'ccache'
          "PM_CCACHE=$exe", "CCACHE_DIR=$env:CCACHE_DIR", "CCACHE_BASEDIR=$env:GITHUB_WORKSPACE", 'CCACHE_MAXSIZE=1G' |
            Add-Content -LiteralPath $env:GITHUB_ENV
          & $exe --zero-stats
      # build.ps1 finds Visual Studio with vswhere and loads its developer environment, which supplies
      # CMake and Ninja.
      - name: Validate
        shell: pwsh
        run: .\validate.ps1
      - name: Show the compile cache's hits
        if: always()
        shell: pwsh
        run: '& $env:PM_CCACHE --show-stats'

  publish-development:
    name: Publish the development build
    if: github.ref == 'refs/heads/development'
    runs-on: windows-latest
    # One publish at a time, never cancelled halfway.
    concurrency:
      group: publish-development
      cancel-in-progress: false
    permissions:
      contents: write # vpk creates the pre-release, and gh removes the old ones
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Squatter's AssetBundle holds Mixamo's clips, which may not be in this public repository: it comes from the
      # private assets repository (the ASSETS_REPOSITORY variable, owner/name) with a read-only deploy key of that
      # repository (the ASSETS_DEPLOY_KEY secret). Without them the build fails at its stage, as it must: Custom Ghosts
      # does not start without the bundle (tools/payload.psd1). The build placed is the one tools/payload.psd1 pins
      # (tools/place_assets.ps1): a pin whose build was never published fails here rather than shipping another.
      - name: Fetch the private assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # A fetch that hangs gives up here instead of holding the run for hours (2026-11-09 and 2026-11-10).
        timeout-minutes: 5
        with:
          repository: ${{ vars.ASSETS_REPOSITORY }}
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: private-assets
          persist-credentials: false
          # Named, so the checkout never looks the default branch up (a run hung there, 2026-11-09), and only the
          # pinned builds: the repository also keeps the working files and the bundle's Unity project, which no build
          # needs.
          ref: main
          sparse-checkout: /pinned/
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Place the Squatter's bundle
        shell: pwsh
        run: |
          ./tools/place_assets.ps1 -Assets private-assets
          Remove-Item -LiteralPath private-assets -Recurse -Force
      - name: Restore vpk
        shell: pwsh
        run: dotnet tool restore
      # In this job's copy alone: only release versions are ever committed.
      - name: Number the build
        shell: pwsh
        env:
          BUILD: ${{ github.run_number }}
        run: |
          . tools/dev_releases.ps1
          $version = Get-DevVersion (Get-Content -LiteralPath VERSION -Raw) ([int]$env:BUILD)
          Set-Content -LiteralPath VERSION -Value $version
          "DEV_VERSION=$version" | Add-Content -LiteralPath $env:GITHUB_ENV
      # The API reference is built with the Doxygen tools/docs.ps1 pins, from Doxygen's own download, checked against
      # its hash before it runs.
      - name: Get Doxygen
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'doxygen.zip'
          Invoke-WebRequest -Uri 'https://www.doxygen.nl/files/doxygen-1.18.0.windows.x64.bin.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($hash -ne 'E84F54CFD49EF06B0B16536056DBEC0C496323DE28ABCCE53A4269463DE35EAF') {
            throw "The Doxygen download's hash is $hash, not the pinned one."
          }
          $dir = Join-Path $env:RUNNER_TEMP 'doxygen'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          "PM_DOXYGEN=$(Join-Path $dir 'doxygen.exe')" | Add-Content -LiteralPath $env:GITHUB_ENV
      # Compiles go through ccache, kept between runs, as in the validate job.
      - name: Restore the compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Get ccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -Uri 'https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($hash -ne '6993CE645E53192CEC592EE23186200B574AC4C59097ECDE8D9CFD681B47AE84') {
            throw "The ccache download's hash is $hash, not the pinned one."
          }
          $dir = Join-Path $env:RUNNER_TEMP 'ccache-tool'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $exe = Join-Path $dir 'ccache-4.14.2-windows-x86_64\ccache.exe'
          $env:CCACHE_DIR = Join-Path $env:RUNNER_TEMP 'ccache'
          "PM_CCACHE=$exe", "CCACHE_DIR=$env:CCACHE_DIR", "CCACHE_BASEDIR=$env:GITHUB_WORKSPACE", 'CCACHE_MAXSIZE=1G' |
            Add-Content -LiteralPath $env:GITHUB_ENV
          & $exe --zero-stats
      - name: Pack the build
        shell: pwsh
        run: .\package.ps1 -Channel dev
      - name: Show the compile cache's hits
        if: always()
        shell: pwsh
        run: '& $env:PM_CCACHE --show-stats'
      - name: Publish the build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          dotnet tool run vpk upload github --repoUrl $env:REPO_URL --publish --pre --channel dev --tag "dev-$env:DEV_VERSION" `
              --targetCommitish $env:GITHUB_SHA --releaseName "PhasmoMods development $env:DEV_VERSION" --outputDir dist/releases --token $env:GH_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed with exit code $LASTEXITCODE." }
          # vpk cannot write a release's body, so the notes come after: the Unreleased section of CHANGELOG.md,
          # and no body at all when it is empty.
          $notes = @(& tools/changelog_section.ps1 -Version Unreleased)
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md has no Unreleased section, which release.ps1 always leaves. Exit code $LASTEXITCODE." }
          if ($notes.Count) {
            $notesFile = Join-Path $env:RUNNER_TEMP 'development-notes.md'
            $notes | Set-Content -LiteralPath $notesFile
            gh release edit "dev-$env:DEV_VERSION" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE." }
          }
      - name: Remove old development builds
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          . tools/dev_releases.ps1
          Remove-OldDevReleases $env:REPOSITORY

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # One publish at a time, never cancelled halfway, so two tags cannot race to upload.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write # vpk creates the GitHub release and uploads its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, so the next step can see whether main contains the tag
      # The Squatter's AssetBundle holds Mixamo's clips, which may not be in this public repository: it comes from the
      # private assets repository (the ASSETS_REPOSITORY variable, owner/name) with a read-only deploy key of that
      # repository (the ASSETS_DEPLOY_KEY secret). Without them the build fails at its stage, as it must: Custom Ghosts
      # does not start without the bundle (tools/payload.psd1). The build placed is the one tools/payload.psd1 pins
      # (tools/place_assets.ps1): a pin whose build was never published fails here rather than shipping another.
      - name: Fetch the private assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # A fetch that hangs gives up here instead of holding the run for hours (2026-11-09 and 2026-11-10).
        timeout-minutes: 5
        with:
          repository: ${{ vars.ASSETS_REPOSITORY }}
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: private-assets
          persist-credentials: false
          # Named, so the checkout never looks the default branch up (a run hung there, 2026-11-09), and only the
          # pinned builds: the repository also keeps the working files and the bundle's Unity project, which no build
          # needs.
          ref: main
          sparse-checkout: /pinned/
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Place the Squatter's bundle
        shell: pwsh
        run: |
          ./tools/place_assets.ps1 -Assets private-assets
          Remove-Item -LiteralPath private-assets -Recurse -Force
      - name: Check the tag is on main
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -eq 1) {
              Write-Error "The tag $env:TAG is on a commit that is not on main. Releases are made from main only."
              exit 1
          }
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Could not check whether main contains the tag $env:TAG (git exit code $LASTEXITCODE)."
              exit 1
          }
      - name: Restore vpk
        shell: pwsh
        run: dotnet tool restore
      - name: Check the tag matches VERSION
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $expected = 'v' + (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:TAG -ne $expected) {
              Write-Error "The tag is $env:TAG but VERSION says $expected."
              exit 1
          }
      # The API reference is built with the Doxygen tools/docs.ps1 pins, from Doxygen's own download, checked against
      # its hash before it runs.
      - name: Get Doxygen
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'doxygen.zip'
          Invoke-WebRequest -Uri 'https://www.doxygen.nl/files/doxygen-1.18.0.windows.x64.bin.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($hash -ne 'E84F54CFD49EF06B0B16536056DBEC0C496323DE28ABCCE53A4269463DE35EAF') {
            throw "The Doxygen download's hash is $hash, not the pinned one."
          }
          $dir = Join-Path $env:RUNNER_TEMP 'doxygen'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          "PM_DOXYGEN=$(Join-Path $dir 'doxygen.exe')" | Add-Content -LiteralPath $env:GITHUB_ENV
      # This job compiles without the compile cache the other jobs keep, so what every player installs is compiled
      # from source alone and owes nothing to an earlier run.
      # package.ps1 validates again, then packs into dist/releases, which it replaces whole. Updates
      # are therefore full packages, not deltas: a delta needs the previous release beside the new
      # pack, and the script packs into an empty folder.
      - name: Pack the release
        shell: pwsh
        run: .\package.ps1
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          dotnet tool run vpk upload github --repoUrl $env:REPO_URL --publish --tag $env:TAG `
              --releaseName "PhasmoMods $env:TAG" --outputDir dist/releases --token $env:GH_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed with exit code $LASTEXITCODE." }
          # vpk cannot write a release's body, so the notes come after: the section release.ps1 wrote for this
          # version. A tag with no section never came from release.ps1, so this fails rather than ship blank notes.
          $version = $env:TAG -replace '^v', ''
          $notes = @(& tools/changelog_section.ps1 -Version $version)
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md has no section for $version; a release comes from tools/release.ps1, which writes one." }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes | Set-Content -LiteralPath $notesFile
          gh release edit $env:TAG --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE." }
